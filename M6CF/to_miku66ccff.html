        :root {

                calc(100% - var(--c1)) 100%, var(--c1) 100%,

        body {

        /* 几何图形层 */

        .panel-shadow {

        .container {

            -webkit-backdrop-filter: blur(5px);
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            z-index: 10;

        .logo {
            display: block;

        h1 {

        .status {

            padding: 7px 14px;
            margin-bottom: 20px;

            font-size: 0.95em;
            word-break: break-all;
        }

        /* 跳转动效条（纯装饰，表示正在跳转） */
        .loading-bar {
            width: 100%;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            clip-path: var(--bar);
            -webkit-clip-path: var(--bar);
            overflow: hidden;
            position: relative;
            margin-bottom: 24px;
        }

        .loading-runner {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, rgba(255,255,255,0), #ffffff, #ff6699);
            animation: slide 0.9s linear infinite;
        }

        @keyframes slide {
            0%   { transform: translateX(-110%); }
            100% { transform: translateX(330%); }
        }

        /* 双层倒角按钮：外层白边，内层粉底 */
        .button {
            display: inline-block;
            background-color: #ffffff;
            clip-path: var(--btn);
            -webkit-clip-path: var(--btn);
            padding: 3px;
            text-decoration: none;
            margin: 6px;
            transition: transform 0.2s ease-out;
            vertical-align: middle;
        }

        .button > span {
            display: block;
            background-color: #ff6699;
            clip-path: var(--btn);
            -webkit-clip-path: var(--btn);
            padding: 12px 28px;
            color: #ffffff;
            font-weight: bold;
            font-size: 1em;
            transition: background-color 0.25s;

        }

        .button:hover {
            transform: translateY(-2px) scale(1.04);
        }

        .button:hover > span {

        .footer-note {

<body>
    <!-- 动态生成的几何图形 -->
    <div id="shapes-container"></div>

    <div class="panel-shadow">
        <div class="container">
            <img class="logo" src="https://miku66ccff.freeflarum.com/assets/logo-cyvx1jbh.png" alt="Miku66ccff 電籽术力口论坛">

            <h1>正在跳转…</h1>
            <div class="status">→ miku66ccff.freeflarum.com</div>

            <p>正在把你送进 Miku66ccff 電籽术力口论坛<br>
            如果浏览器没有自动跳转，点下面的按钮就好啦！</p>

            <div class="loading-bar"><div class="loading-runner"></div></div>

            <div>
                <a class="button" href="https://miku66ccff.freeflarum.com/?sort=newest5">
                    <span>手动前往论坛</span>
                </a>
            </div>

            <p class="footer-note">
                目标地址：<a href="https://miku66ccff.freeflarum.com/?sort=newest5">miku66ccff.freeflarum.com</a><br>
                联系站长小小电子xxdz，或在论坛里敲敲音符~
            </p>
        </div>
    </div>

    <script>
        /* ---------------- 立即跳转（打开就尽快跳） ---------------- */
        (function () {
            var TARGET_URL = 'https://miku66ccff.freeflarum.com/?sort=newest5';

            function go() {
                window.location.replace(TARGET_URL);
            }

            // 等页面绘制一帧后立刻跳转（约 30ms 内），既能瞬间跳转，也保证页面能闪出来
            function goSoon() {
                requestAnimationFrame(function () {
                    requestAnimationFrame(go);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', goSoon);
            } else {
                goSoon();
            }
        })();

        /* ---------------- 几何图形背景 ---------------- */
        const shapesContainer = document.getElementById('shapes-container');
        const shapes = [];
        const colors = ['rgba(255,255,255,0.4)', 'rgba(255,102,153,0.4)', 'rgba(102,204,255,0.4)'];

        // 初始化 20 个图形
        for (let i = 0; i < 20; i++) {
            createShape();
        }

        function createShape() {
            const shape = document.createElement('div');
            shape.className = 'shape';

            // 随机选择形状类型
            const shapeTypes = ['circle', 'triangle', 'square'];
            const type = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];
            shape.classList.add(type);

            // 设置随机大小
            const size = Math.random() * 100 + 50;

            if (type === 'circle') {
                shape.style.width = `${size}px`;
                shape.style.height = `${size}px`;
                shape.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            }
            else if (type === 'triangle') {
                shape.style.borderWidth = `0 ${size / 2}px ${size * 0.866}px ${size / 2}px`;
                shape.style.borderBottomColor = colors[Math.floor(Math.random() * colors.length)];
            }
            else if (type === 'square') {
                shape.style.width = `${size}px`;
                shape.style.height = `${size}px`;
                shape.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                shape.style.transform = `rotate(${Math.random() * 45}deg)`;
            }

            // 随机位置
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;

            shape.style.left = `${x}px`;
            shape.style.top = `${y}px`;

            shapesContainer.appendChild(shape);
            shapes.push({
                element: shape,
                x: x,
                y: y,
                vx: Math.random() * 2 - 1,
                vy: Math.random() * 2 - 1
            });
        }

        // 鼠标移动交互
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            shapes.forEach(shape => {
                const rect = shape.element.getBoundingClientRect();
                const shapeX = rect.left + rect.width / 2;
                const shapeY = rect.top + rect.height / 2;

                const dx = mouseX - shapeX;
                const dy = mouseY - shapeY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 200 && distance > 0.01) {
                    const force = (200 - distance) / 20;
                    const angle = Math.atan2(dy, dx);

                    shape.x -= Math.cos(angle) * force;
                    shape.y -= Math.sin(angle) * force;
                }

                // 边界检查
                if (shape.x < 0) shape.x = 0;
                if (shape.x > window.innerWidth) shape.x = window.innerWidth;
                if (shape.y < 0) shape.y = 0;
                if (shape.y > window.innerHeight) shape.y = window.innerHeight;

                shape.element.style.left = `${shape.x}px`;
                shape.element.style.top = `${shape.y}px`;
            });
        });

        // 让图形缓慢漂移
        function animate() {
            shapes.forEach(shape => {
                shape.x += shape.vx;
                shape.y += shape.vy;

                // 边界反弹
                const rect = shape.element.getBoundingClientRect();
                if (shape.x < 0 || shape.x + rect.width > window.innerWidth) {
                    shape.vx *= -1;
                }
                if (shape.y < 0 || shape.y + rect.height > window.innerHeight) {
                    shape.vy *= -1;
                }

                shape.element.style.left = `${shape.x}px`;
                shape.element.style.top = `${shape.y}px`;
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
